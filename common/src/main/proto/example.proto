syntax = "proto3";

package uprotocol.example.v1;

import "uprotocol/uoptions.proto";
import "uprotocol/v1/ustatus.proto";
import "uprotocol/v1/uri.proto";

option java_package = "org.eclipse.uprotocol.example.v1";
option java_outer_classname = "ExampleProto";
option java_multiple_files = true;

// The greeting service definition.
service Example {
  option (uprotocol.service_name) = "example.service";
  option (uprotocol.service_version_major) = 1;
  option (uprotocol.service_version_minor) = 0;
  option (uprotocol.service_id) = 0x52;

  option (uprotocol.publish_topic) = {
    id: 0x8000,
    name: "doors.front_left",
    message: "Doors"
  };

  option (uprotocol.publish_topic) = {
    id: 0x8001,
    name: "doors.front_right",
    message: "Doors"
  };

  rpc executeDoorCommand (DoorCommand) returns (uprotocol.v1.UStatus) {
    option (uprotocol.method_id) = 1;
  }
}

message DoorCommand {
  enum Action {
    UNSPECIFIED = 0;
    LOCK = 1;
    UNLOCK = 2;
  }
  Door door = 1;
  Action action = 2;
}

message Door {
  uint32 id = 1;
  optional bool locked = 2;
}
